global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: hpa-local
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8787"]
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:9464"]
