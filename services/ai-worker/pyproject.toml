[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hpa-ai-worker"
version = "0.1.0"
description = "Optional LangGraph worker for the HPA agent runtime"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "MIT" }
dependencies = [
  "fastapi==0.162.0",
  "filelock==4.2.1",
  "langgraph==1.2.19",
  "langgraph-checkpoint-postgres==3.2.0",
  "langgraph-checkpoint-sqlite==3.1.3",
  "litellm==1.106.6",
  "opentelemetry-exporter-otlp-proto-http==1.45.2",
  "opentelemetry-sdk==1.45.2",
  "psycopg[binary,pool]==3.3.6",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
]

[project.scripts]
hpa-ai-worker = "hpa_ai_worker.cli:main"

[dependency-groups]
dev = [
  "mypy==2.4.1",
  "pip-audit==2.9.0",
  "pytest==9.2.0",
  "pytest-asyncio==1.3.0",
  "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hpa_ai_worker"]

[tool.uv]
override-dependencies = ["filelock==4.2.1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["hpa_ai_worker"]
